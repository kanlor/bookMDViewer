<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KanlorOne MDViewer</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="toolbar">
      <div class="toolbar-group" id="fmt-group">
        <button id="fmt-h1" title="标题1 (Ctrl+1)">H1</button>
        <button id="fmt-h2" title="标题2 (Ctrl+2)">H2</button>
        <button id="fmt-h3" title="标题3 (Ctrl+3)">H3</button>
        <button id="fmt-h4" title="标题4 (Ctrl+4)">H4</button>
        <button id="fmt-h5" title="标题5 (Ctrl+5)">H5</button>
        <button id="fmt-para" title="正文 (Ctrl+`)">¶</button>
        <button id="fmt-ol" title="有序列表 (Alt+1)">1.</button>
        <button id="fmt-ul" title="无序列表 (Alt+2)">•</button>
        <button id="fmt-blockquote" title="引用 (Alt+5)">❝</button>
        <button id="fmt-codeblock" title="代码块 (Alt+3)">⟨/⟩</button>
        <button id="fmt-hr" title="分割线 (Alt+7)">───</button>
        <button id="fmt-bold" title="粗体 (Ctrl+B)"><b>B</b></button>
        <button id="fmt-italic" title="斜体 (Ctrl+I)"><i>I</i></button>
        <button id="fmt-code" title="行内代码 (Alt+`)">&lt;/&gt;</button>
        <button id="fmt-link" title="链接 (Alt+6)">🔗</button>
        <button id="fmt-image" title="图片 (Alt+4)">🖼</button>
      </div>
      <div class="toolbar-spacer"></div>
      <div class="toolbar-group" id="action-group">
        <button id="open-btn" class="icon-btn" title="打开文件 (Ctrl+O)" aria-label="打开文件">📂</button>
        <button id="files-btn" class="icon-btn" title="文件浏览器 (Ctrl+B)" aria-label="文件浏览器">🗂</button>
        <button id="font-dec" class="icon-btn" title="缩小字体 (Ctrl+-)" aria-label="缩小字体">A−</button>
        <button id="font-inc" class="icon-btn" title="放大字体 (Ctrl++)" aria-label="放大字体">A+</button>
        <button id="wide-toggle" class="icon-btn" title="宽版 / 窄版切换 (Ctrl+Shift+\)" aria-label="切换宽版">↔</button>
        <button id="theme-toggle" class="icon-btn" title="主题:跟随系统 (点击切换)" aria-label="切换主题">🖥️</button>
        <button id="settings-btn" class="icon-btn" title="设置" aria-label="设置">⚙</button>
        <button id="save-btn" title="保存 (Ctrl+S)" aria-label="保存" hidden>💾 保存</button>
        <button id="export-btn" title="导出为 HTML" aria-label="导出为 HTML">⬇ HTML</button>
        <button id="edit-toggle" title="切换编辑模式 (Ctrl+E)" aria-label="切换编辑模式">✎ 编辑</button>
        <button id="toc-toggle" title="切换大纲 (Ctrl+\)" aria-label="切换大纲">☰</button>
        <button id="close-doc-btn" class="icon-btn" title="关闭文档 — 返回首页" aria-label="关闭文档" hidden>✕</button>
      </div>
    </div>
    <div id="toast" hidden></div>
    <div id="find-bar" hidden>
      <input id="find-input" type="text" placeholder="查找…" spellcheck="false" />
      <span id="find-count"></span>
      <button id="find-prev" title="上一个 (Shift+Enter)" aria-label="上一个匹配">↑</button>
      <button id="find-next" title="下一个 (Enter)" aria-label="下一个匹配">↓</button>
      <input id="replace-input" type="text" placeholder="替换…" spellcheck="false" />
      <button id="replace-one" title="替换当前匹配">替换</button>
      <button id="replace-all" title="替换全部匹配">全部</button>
      <button id="find-close" title="关闭 (Esc)" aria-label="关闭查找">✕</button>
    </div>
    <div id="layout">
      <nav id="files" aria-label="File explorer"></nav>
      <nav id="toc" aria-label="Table of contents"></nav>
      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Markdown 源码…"
      ></textarea>
      <article id="content" class="markdown-body">
        <div class="empty-state">
          <h1>KanlorOne MDViewer</h1>
          <p>拖放 <code>.md</code> 文件到此处，或 <a id="empty-open" href="#">打开文件</a>。</p>
          <p class="app-version"><a id="about-open" href="#">关于 / About</a></p>
          <div id="recent-list"></div>
        </div>
      </article>
    </div>

    <div id="status-bar">
      <span id="sb-path" class="sb-item sb-path" title="文件路径">未打开文件</span>
      <span class="sb-sep">|</span>
      <span id="sb-outline" class="sb-item" title="大纲统计">H1:0 / H2:0</span>
      <span class="sb-sep">|</span>
      <span id="sb-stats" class="sb-item" title="内容统计">中文:0 总字:0 图:0 表:0 代码:0</span>
      <span class="sb-sep">|</span>
      <span id="sb-fileinfo" class="sb-item" title="文件属性">--</span>
    </div>

    <div id="diagram-modal" hidden>
      <div id="diagram-toolbar">
        <button id="dg-zoomout" title="缩小">−</button>
        <span id="dg-zoom">100%</span>
        <button id="dg-zoomin" title="放大">+</button>
        <button id="dg-reset" title="适应屏幕">重置</button>
        <button id="dg-close" title="关闭 (Esc)">✕</button>
      </div>
      <div id="diagram-stage"></div>
    </div>

    <div id="settings-modal" hidden>
      <div class="modal-box settings-box">
        <div class="settings-title">设置 / Settings</div>
        <div class="settings-row">
          <label for="font-latin">英文字体 / Latin font</label>
          <select id="font-latin"></select>
        </div>
        <input id="font-latin-custom" class="font-custom" list="font-list" placeholder="输入字体名称…" spellcheck="false" autocomplete="off" hidden />
        <div class="settings-row">
          <label for="font-cjk">中文字体 / CJK font</label>
          <select id="font-cjk"></select>
        </div>
        <input id="font-cjk-custom" class="font-custom" list="font-list" placeholder="输入字体名称…" spellcheck="false" autocomplete="off" hidden />
        <datalist id="font-list"></datalist>
        <p class="settings-preview" id="font-preview">
          The quick brown fox — 敏捷的棕色狐狸 0123
        </p>

        <div class="modal-actions">
          <button id="settings-reset">重置字体</button>
          <button id="settings-close">关闭</button>
        </div>
      </div>
    </div>

    <div id="about-modal" hidden>
      <div class="modal-box about-box">
        <div class="about-logo">📘</div>
        <div class="about-name">KanlorOne MDViewer</div>
        <div class="about-ver" id="about-version"></div>
        <p class="about-desc">
          轻量、完全本机的 Markdown 查看器与编辑器。<br />
          Lightweight, local-first Markdown viewer &amp; editor.
        </p>
        <div class="about-qr">
          <div class="qr-item">
            <img src="qr/weixin.png" alt="微信" />
            <span>微信</span>
          </div>
          <div class="qr-item">
            <img src="qr/gongzhonghao.png" alt="公众号" />
            <span>公众号</span>
          </div>
          <div class="qr-item">
            <img src="qr/feedback.png" alt="问题反馈" />
            <span>问题反馈</span>
          </div>
        </div>
        <div class="modal-actions">
          <button id="about-close">关闭</button>
        </div>
      </div>
    </div>

    <div id="close-modal" hidden>
      <div class="modal-box">
        <p>有未保存的更改，要在关闭前保存吗？</p>
        <div class="modal-actions">
          <button id="modal-save">保存并关闭</button>
          <button id="modal-discard">不保存关闭</button>
          <button id="modal-cancel">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
